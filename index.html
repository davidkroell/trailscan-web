<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trailscan-web</title>
  </head>
  <body class="h-screen w-screen overflow-hidden" x-data="trailscanApp()">
    <div class="relative flex h-full w-full">
      <aside
        class="flex h-full shrink-0 flex-col overflow-y-auto border-r border-base-300 bg-base-100 transition-[width] duration-200"
        :class="sidebarOpen ? 'w-96 p-4' : 'w-0 p-0'"
      >
        <div class="min-w-80" x-show="sidebarOpen" x-cloak>
          <h1 class="text-xl font-bold">trailscan-web</h1>
          <p class="mt-1 text-sm text-base-content/70">
            Drop a GPX track to find the named features it passes.
          </p>

          <div
            class="mt-4 flex cursor-pointer flex-col items-center justify-center rounded-box border-2 border-dashed border-base-300 p-6 text-center text-sm"
            @dragover.prevent
            @drop.prevent="onDrop($event)"
            @click="$refs.fileInput.click()"
          >
            <template x-if="fileName">
              <span class="font-medium" x-text="fileName"></span>
            </template>
            <template x-if="!fileName">
              <span>Drag &amp; drop a GPX file here, or click to choose one</span>
            </template>
            <input
              x-ref="fileInput"
              type="file"
              accept=".gpx"
              class="hidden"
              @change="onFileSelected($event.target.files[0])"
            />
          </div>

          <div class="mt-4 flex flex-col gap-3">
            <label class="form-control">
              <span class="label-text">Feature set</span>
              <select class="select select-bordered select-sm" x-model="options.querytemplate">
                <template x-for="t in queryTemplates" :key="t.value">
                  <option :value="t.value" x-text="t.label"></option>
                </template>
              </select>
            </label>

            <label class="form-control">
              <span class="label-text">Max distance (m)</span>
              <input
                type="number"
                min="1"
                max="1000"
                class="input input-bordered input-sm"
                x-model.number="options.max_distance"
              />
            </label>

            <label class="form-control">
              <span class="label-text">Max elevation diff (m)</span>
              <input
                type="number"
                min="1"
                max="1000"
                class="input input-bordered input-sm"
                x-model.number="options.max_elevation_diff"
              />
            </label>

            <label class="flex cursor-pointer items-center gap-2">
              <input type="checkbox" class="checkbox checkbox-sm" x-model="options.simplify_gpx" />
              <span class="label-text">Simplify GPX (faster)</span>
            </label>
          </div>

          <button
            class="btn btn-primary btn-sm mt-4 w-full"
            :disabled="!canLoadFeatures"
            :class="{ 'btn-disabled': !canLoadFeatures }"
            @click="loadFeatures()"
          >
            <span x-show="status === 'loading'" class="loading loading-spinner loading-xs"></span>
            <span x-text="wasmReady ? 'Load features' : 'Loading WASM…'"></span>
          </button>

          <p class="mt-2 text-sm text-error" x-show="status === 'error'" x-text="error"></p>

          <template x-if="track">
            <div class="mt-4 text-sm">
              <div>Distance: <span x-text="(track.distanceMeters / 1000).toFixed(1)"></span> km</div>
              <div>Elevation gain: <span x-text="track.elevationGainMeters.toFixed(0)"></span> m</div>
            </div>
          </template>

          <template x-if="features.length > 0">
            <div class="mt-4 flex flex-1 flex-col">
              <div class="flex items-center justify-between">
                <h2 class="font-semibold">
                  Features (<span x-text="features.length"></span>)
                </h2>
                <button class="btn btn-ghost btn-xs" @click="exportGpx()">Export GPX</button>
              </div>

              <ul class="menu mt-1 w-full gap-1 p-0">
                <template x-for="feature in features" :key="feature.num">
                  <li>
                    <div class="flex items-center gap-2">
                      <input
                        type="checkbox"
                        class="checkbox checkbox-xs"
                        x-model="feature.included"
                        @change="toggleFeature(feature)"
                        @click.stop
                      />
                      <button class="flex-1 truncate text-left" @click="selectFeature(feature)">
                        <span x-text="feature.num"></span>. <span x-text="feature.name || feature.type"></span>
                        <span class="text-xs text-base-content/60" x-text="'(' + feature.type + ')'"></span>
                      </button>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>
      </aside>

      <button
        class="btn btn-circle btn-sm absolute top-4 left-4 z-[1000]"
        :class="sidebarOpen ? 'ml-[23.5rem]' : 'ml-0'"
        @click="sidebarOpen = !sidebarOpen"
        aria-label="Toggle sidebar"
      >
        <span x-text="sidebarOpen ? '‹' : '›'"></span>
      </button>

      <main class="relative h-full flex-1">
        <div x-ref="map" class="h-full w-full bg-base-200"></div>

        <a href="https://github.com/davidkroell/trailscan-web" target="_blank" rel="noopener" class="btn btn-circle btn-sm absolute top-0 right-0 z-[1000] github-corner" aria-label="trailscan-web on GitHub">
          <svg width="80" height="80" viewBox="0 0 250 250"
               style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
                  fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"/>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
                  fill="currentColor" class="octo-body"/>
          </svg>
        </a>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
  <style>.github-corner:hover .octo-arm {
    animation: octocat-wave 560ms ease-in-out
  }

  @keyframes octocat-wave {
    0%, 100% {
      transform: rotate(0)
    }
    20%, 60% {
      transform: rotate(-25deg)
    }
    40%, 80% {
      transform: rotate(10deg)
    }
  }

  @media (max-width: 500px) {
    .github-corner:hover .octo-arm {
      animation: none
    }

    .github-corner .octo-arm {
      animation: octocat-wave 560ms ease-in-out
    }
  }
  </style>
</html>
