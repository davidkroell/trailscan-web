<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trailscan — GPX trail feature finder</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'sha256-MekhvMzarLVaYZwrnEokcj5zsqLg4pL7geBgt4V5u0g='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' blob: https://overpass-api.de; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      (function () {
        var t = localStorage.getItem('trailscan-theme')
        if (t !== 'trailscan-dark' && t !== 'trailscan-light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'trailscan-dark'
            : 'trailscan-light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body class="h-screen w-screen overflow-hidden" x-data="trailscanApp()">
    <div class="relative h-full w-full">
      <div x-ref="map" class="h-full w-full"></div>

      <!-- Floating sidebar -->
      <aside
        class="absolute top-4 left-4 bottom-4 z-[1000] w-[24rem] overflow-hidden rounded-3xl border border-base-300/60 bg-base-100/85 shadow-2xl shadow-black/10 backdrop-blur-xl transition-all duration-300 ease-out"
        :class="sidebarOpen ? 'translate-x-0 opacity-100' : '-translate-x-8 opacity-0 pointer-events-none'"
      >
        <div class="flex h-full w-[24rem] flex-col gap-5 overflow-y-auto p-5 scrollbar-thin">
          <header class="flex items-center gap-3">
            <div
              class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-primary to-accent text-primary-content shadow-lg shadow-primary/30"
            >
              <svg
                class="h-6 w-6"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
              </svg>
            </div>
            <div class="min-w-0">
              <h1 class="text-lg leading-tight font-bold tracking-tight">trailscan</h1>
              <p class="truncate text-xs text-base-content/60">
                GPX trail feature finder
              </p>
            </div>
          </header>

          <!-- Drop zone -->
          <div
            class="group relative cursor-pointer rounded-2xl border-2 border-dashed p-6 text-center transition-all duration-200"
            :class="dragOver
              ? 'scale-[1.01] border-primary bg-primary/10'
              : 'border-base-300 hover:border-primary/60 hover:bg-base-200/60'"
            @dragover.prevent="dragOver = true"
            @dragenter.prevent="dragOver = true"
            @dragleave="dragOver = false"
            @drop.prevent="dragOver = false; onDrop($event)"
            @click="$refs.fileInput.click()"
          >
            <template x-if="!fileName">
              <div class="flex flex-col items-center gap-2">
                <div
                  class="flex h-12 w-12 items-center justify-center rounded-2xl bg-primary/10 text-primary transition-transform duration-200 group-hover:scale-110"
                >
                  <svg
                    class="h-6 w-6"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                </div>
                <div>
                  <p class="text-sm font-semibold">Drop your GPX track</p>
                  <p class="mt-0.5 text-xs text-base-content/50">or click to browse</p>
                </div>
              </div>
            </template>
            <template x-if="fileName">
              <div class="flex items-center justify-between gap-2 text-left">
                <div class="flex min-w-0 items-center gap-2">
                  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-success/15 text-success">
                    <svg
                      class="h-4 w-4"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                      <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                    </svg>
                  </div>
                  <span class="truncate text-sm font-medium" x-text="fileName"></span>
                </div>
                <button
                  class="btn btn-ghost btn-circle btn-xs"
                  @click.stop="clearFile()"
                  aria-label="Remove file"
                >
                  <svg
                    class="h-3.5 w-3.5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>
            </template>
            <input
              x-ref="fileInput"
              type="file"
              accept=".gpx"
              class="hidden"
              @change="onFileSelected($event.target.files[0])"
            />
          </div>

          <!-- Options -->
          <div class="flex flex-col gap-4 rounded-2xl border border-base-300/60 bg-base-100/60 p-4">
            <label class="flex flex-col gap-1.5">
              <span class="text-xs font-semibold tracking-wider text-base-content/50 uppercase">
                Feature set
              </span>
              <select class="select select-sm w-full" x-model="options.querytemplate">
                <template x-for="t in queryTemplates" :key="t.value">
                  <option :value="t.value" x-text="t.label"></option>
                </template>
              </select>
            </label>

            <label class="flex flex-col gap-1.5">
              <span
                class="flex items-center justify-between text-xs font-semibold tracking-wider text-base-content/50 uppercase"
              >
                <span>Max distance</span>
                <span class="badge badge-primary badge-sm" x-text="options.max_distance + ' m'"></span>
              </span>
              <input
                type="range"
                min="5"
                max="500"
                step="5"
                class="range range-primary range-sm"
                x-model.number="options.max_distance"
              />
            </label>

            <label class="flex flex-col gap-1.5">
              <span
                class="flex items-center justify-between text-xs font-semibold tracking-wider text-base-content/50 uppercase"
              >
                <span>Max elevation diff</span>
                <span
                  class="badge badge-accent badge-sm"
                  x-text="options.max_elevation_diff + ' m'"
                ></span>
              </span>
              <input
                type="range"
                min="5"
                max="300"
                step="5"
                class="range range-accent range-sm"
                x-model.number="options.max_elevation_diff"
              />
            </label>

            <label class="flex cursor-pointer items-center justify-between gap-2">
              <span>
                <span class="block text-sm font-medium">Simplify GPX</span>
                <span class="block text-xs text-base-content/50">Fewer points, faster processing</span>
              </span>
              <input
                type="checkbox"
                class="toggle toggle-primary toggle-sm"
                x-model="options.simplify_gpx"
              />
            </label>
          </div>

          <button
            class="btn btn-primary"
            :disabled="!canLoadFeatures"
            :class="{ 'btn-disabled': !canLoadFeatures, 'shadow-lg shadow-primary/25': canLoadFeatures }"
            @click="loadFeatures()"
          >
            <span x-show="status === 'loading'" class="loading loading-spinner loading-xs"></span>
            <span x-text="wasmReady ? 'Load features' : 'Loading WASM…'"></span>
          </button>

          <p class="text-sm text-error" x-show="status === 'error'" x-text="error"></p>

          <!-- Track stats -->
          <template x-if="track">
            <div class="grid grid-cols-2 gap-3">
              <div class="flex items-center gap-2.5 rounded-2xl border border-base-300/60 bg-base-100/60 p-3">
                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary">
                  <svg
                    class="h-4 w-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="6" cy="19" r="3" />
                    <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
                    <circle cx="18" cy="5" r="3" />
                  </svg>
                </div>
                <div>
                  <div class="text-lg leading-none font-bold" x-text="(track.distanceMeters / 1000).toFixed(1)"></div>
                  <div class="mt-0.5 text-[11px] text-base-content/50">km distance</div>
                </div>
              </div>
              <div class="flex items-center gap-2.5 rounded-2xl border border-base-300/60 bg-base-100/60 p-3">
                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-accent/10 text-accent">
                  <svg
                    class="h-4 w-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                    <polyline points="16 7 22 7 22 13" />
                  </svg>
                </div>
                <div>
                  <div class="text-lg leading-none font-bold" x-text="track.elevationGainMeters.toFixed(0)"></div>
                  <div class="mt-0.5 text-[11px] text-base-content/50">m elevation gain</div>
                </div>
              </div>
            </div>
          </template>

          <!-- Features -->
          <template x-if="features.length > 0">
            <div class="flex flex-col gap-3">
              <div class="flex items-center justify-between">
                <h2 class="flex items-center gap-2 text-xs font-semibold tracking-wider text-base-content/50 uppercase">
                  Features
                  <span class="badge badge-neutral badge-sm" x-text="features.length"></span>
                </h2>
                <button class="btn btn-ghost btn-xs" @click="exportGpx()">
                  <svg
                    class="h-3.5 w-3.5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                  </svg>
                  Export GPX
                </button>
              </div>

              <ul class="flex flex-col gap-1.5">
                <template x-for="feature in features" :key="feature.num">
                  <li
                    class="flex items-center gap-2.5 rounded-xl border px-2.5 py-2 transition-all duration-150"
                    :class="selectedFeature === feature.num
                      ? 'border-primary/50 bg-primary/5 ring-1 ring-primary/20'
                      : 'border-transparent hover:border-base-300 hover:bg-base-200/60'"
                  >
                    <input
                      type="checkbox"
                      class="checkbox checkbox-primary checkbox-sm"
                      x-model="feature.included"
                      @change="toggleFeature(feature)"
                      @click.stop
                    />
                    <button class="flex min-w-0 flex-1 items-center gap-2 text-left" @click="selectFeature(feature)">
                      <span class="badge badge-ghost badge-sm shrink-0 font-mono" x-text="feature.num"></span>
                      <span class="min-w-0 flex-1 truncate text-sm font-medium" x-text="feature.name || feature.type"></span>
                      <span class="badge badge-sm shrink-0" :class="typeBadge(feature.type)" x-text="feature.type"></span>
                    </button>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>
      </aside>

      <!-- Sidebar toggle -->
      <button
        class="absolute top-4 z-[1001] btn btn-circle btn-sm border border-base-300/60 bg-base-100/80 text-base-content shadow-lg backdrop-blur-xl transition-all duration-300 hover:bg-base-100"
        :class="sidebarOpen ? 'left-[24.25rem]' : 'left-4'"
        @click="sidebarOpen = !sidebarOpen"
        aria-label="Toggle sidebar"
      >
        <svg
          class="h-4 w-4 transition-transform duration-300"
          :class="sidebarOpen ? 'rotate-180' : ''"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>

      <!-- Top-right controls -->
      <div class="absolute top-4 right-4 z-[1000] flex items-center gap-2">
        <button
          class="btn btn-circle btn-sm border border-base-300/60 bg-base-100/80 text-base-content shadow-lg backdrop-blur-xl hover:bg-base-100"
          @click="toggleTheme()"
          aria-label="Toggle theme"
        >
          <svg
            x-cloak
            x-show="theme === 'trailscan-dark'"
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
          <svg
            x-cloak
            x-show="theme === 'trailscan-light'"
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
        <a
          href="https://github.com/davidkroell/trailscan-web"
          target="_blank"
          rel="noopener"
          class="btn btn-circle btn-sm border border-base-300/60 bg-base-100/80 text-base-content shadow-lg backdrop-blur-xl hover:bg-base-100"
          aria-label="trailscan-web on GitHub"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.95.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.73.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.66.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.67.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
            />
          </svg>
        </a>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
